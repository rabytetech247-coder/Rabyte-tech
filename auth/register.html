<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Register | Rabyte-Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/components/header.js"></script>
  <script src="/js/components/footer.js"></script>
</head>
<body>
  <template-header></template-header>
  <main class="auth">
    <div class="auth-card">
      <h1>Create an Account</h1>
      <p style="color:var(--m); font-size:13px;">Join the community of creators and builders.</p>
      <div id="register-error" class="notice" style="display:none; border-color:#ef4444; background:#fef2f2; color:#b91c1c;"></div>
      
      <form id="register-form">
        <div class="field">
          <span>Full Name</span>
          <input type="text" id="reg-name" required />
        </div>
        <div class="field">
          <span>Email Address</span>
          <input type="email" id="reg-email" required />
        </div>
        <div class="field">
          <span>Username</span>
          <input type="text" id="reg-username" required />
        </div>
        <div class="field">
          <span>Password</span>
          <input type="password" id="reg-password" required minlength="6" />
        </div>
        <button type="submit" class="btn-cta" style="width:100%; justify-content:center; margin-top:10px;">Sign Up</button>
      </form>
      <div style="text-align:center; margin-top:15px; font-size:12px;">
        Already have an account? <a href="/auth/login.html" style="font-weight:700;">Log In</a>
      </div>
    </div>
  </main>
  <template-footer></template-footer>
  <script src="/js/auth.js"></script>
</body>
</html>
