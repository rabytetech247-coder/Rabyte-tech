<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Login | Rabyte-Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/components/header.js"></script>
  <script src="/js/components/footer.js"></script>
  <style>
    .auth-container { max-width: 400px; margin: 100px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    .auth-input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .auth-btn { width: 100%; padding: 10px; background: #0f172a; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .error-msg { color: #ef4444; font-size: 14px; margin-bottom: 10px; display: none; }
  </style>
</head>
<body style="font-family: 'Inter', sans-serif; background: #f8fafc; margin: 0;">

  <template-header></template-header>

  <main class="auth">
    <div class="auth-card">
      <h2 style="margin-top: 0; text-align: center;">Welcome Back</h2>
      <div id="error-message" class="notice" style="display:none; border-color:#ef4444; background:#fef2f2; color:#b91c1c;"></div>
      <form id="login-form">
        <div class="field">
          <span>Email</span>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <span>Password</span>
          <input type="password" id="password" required />
          <a href="/auth/forgot-password.html" style="text-align:right; font-size:11px; margin-top:-10px;">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-cta" style="width: 100%; justify-content:center; margin-top:10px;">Login</button>
      </form>
      <div style="text-align:center; margin-top:15px; font-size:12px;">
        Don't have an account? <a href="/auth/register.html" style="font-weight:700;">Sign Up</a>
      </div>
    </div>
    
    <!-- Change Password Modal -->
    <div id="change-password-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; place-items:center;">
      <div class="auth-card" style="background:#fff;">
        <h2 style="margin-top:0;">Change Temporary Password</h2>
        <p style="font-size:12px; color:var(--m);">For security, please set a new password.</p>
        <div id="cp-error" class="notice" style="display:none; border-color:#ef4444; background:#fef2f2; color:#b91c1c;"></div>
        <form id="change-password-form">
          <div class="field">
            <span>New Password</span>
            <input type="password" id="cp-new" required minlength="6"/>
          </div>
          <div class="field">
            <span>Confirm Password</span>
            <input type="password" id="cp-confirm" required minlength="6"/>
          </div>
          <button type="submit" class="btn-cta" style="width: 100%; justify-content:center; margin-top:10px;">Save & Continue</button>
        </form>
      </div>
    </div>
  </main>

  <template-footer></template-footer>

  <script src="/js/auth.js"></script>
</body>
</html>
