<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Forgot Password | Rabyte-Tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/components/header.js"></script>
  <script src="/js/components/footer.js"></script>
</head>
<body>
  <template-header></template-header>
  <main class="auth">
    <div class="auth-card" id="forgot-card">
      <h1>Reset Password</h1>
      <p style="color:var(--m); font-size:13px;">Enter your registered email address and we will send you a temporary password.</p>
      <div id="forgot-error" class="notice" style="display:none; border-color:#ef4444; background:#fef2f2; color:#b91c1c;"></div>
      
      <form id="forgot-form">
        <div class="field">
          <span>Email Address</span>
          <input type="email" id="forgot-email" required />
        </div>
        <button type="submit" class="btn-cta" style="width:100%; justify-content:center; margin-top:10px;">Send Temporary Password</button>
      </form>
      <div style="text-align:center; margin-top:15px; font-size:12px;">
        Remembered it? <a href="/auth/login.html" style="font-weight:700;">Log In</a>
      </div>
    </div>

    <div class="auth-card" id="forgot-success" style="display:none; text-align:center;">
      <div style="font-size:40px; margin-bottom:10px;">✅</div>
      <h2>Email Sent!</h2>
      <p style="color:var(--m); font-size:13px;">If an account exists, a temporary password has been sent to your email.</p>
      <a href="/auth/login.html" class="btn-cta" style="display:inline-flex; margin-top:15px;">Go to Login</a>
    </div>
  </main>
  <template-footer></template-footer>
  <script src="/js/auth.js"></script>
</body>
</html>
